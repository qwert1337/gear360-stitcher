[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gear360-stitcher"
version = "0.1.0"
description = "Stitch Samsung Gear 360 dual-fisheye photos and videos into equirectangular panoramas using Double Sphere calibrations"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hauke Brunken" }]
keywords = ["samsung", "gear360", "360", "panorama", "equirectangular", "fisheye", "stitching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/qwert1337/gear360-stitcher"
Repository = "https://github.com/qwert1337/gear360-stitcher"
Issues = "https://github.com/qwert1337/gear360-stitcher/issues"

[project.scripts]
gear360-stitch = "gear360_stitcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gear360_stitcher = ["data/R_t.txt", "data/*/*.json"]
