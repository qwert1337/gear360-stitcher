name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build PyInstaller (including its bootloader) from source. The prebuilt
      # bootloader in the PyInstaller wheels is widely flagged by antivirus
      # software; a locally compiled one is not on any blocklist.
      - name: Install package and PyInstaller
        run: |
          python -m pip install --no-binary pyinstaller pyinstaller
          python -m pip install .

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onedir --noupx --name gear360-stitch
          --collect-data gear360_stitcher packaging/run.py

      - name: Smoke test
        run: |
          dist\gear360-stitch\gear360-stitch.exe --help
          python packaging/smoke_test.py dist\gear360-stitch\gear360-stitch.exe

      - name: Package
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata as m; print(m.version('gear360-stitcher'))"
          $name = "gear360-stitcher-$version-windows-x64"
          if ("${{ github.ref_type }}" -ne "tag") { $name += "-dev-" + "${{ github.sha }}".Substring(0, 7) }
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item -Recurse dist\gear360-stitch\* $name
          Copy-Item LICENSE, README.md, packaging\THIRD-PARTY-NOTICES.txt $name
          python packaging/collect_licenses.py "$name\licenses"
          "NAME=$name" >> $env:GITHUB_ENV

      # upload-artifact zips what it is given, so hand it the folder rather
      # than a zip (that would be a zip inside a zip).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "$env:NAME" -DestinationPath "$env:NAME.zip"
          $ErrorActionPreference = "Continue"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" "$env:NAME.zip" --clobber
