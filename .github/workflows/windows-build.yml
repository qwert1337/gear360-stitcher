name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: python -m pip install pyinstaller .

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onedir --name gear360-stitch
          --collect-data gear360_stitcher packaging/run.py

      - name: Smoke test
        run: |
          dist\gear360-stitch\gear360-stitch.exe --help
          python packaging/smoke_test.py dist\gear360-stitch\gear360-stitch.exe

      - name: Package
        shell: pwsh
        run: |
          $name = "gear360-stitcher-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item -Recurse dist\gear360-stitch\* $name
          Copy-Item LICENSE, README.md, packaging\THIRD-PARTY-NOTICES.txt $name
          python packaging/collect_licenses.py "$name\licenses"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.ZIP }}

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" "$env:ZIP" --clobber
